        var sAgent = navigator.userAgent

        // IF THE BROWSER IS MSIE4.0 AND IS NOT 4.0b1, THEN bIsIE4 = true

        hotColor = "#004000"
        function hideAds(){
                var sites=document.all.tags("SPAN");
                var i;
                var sn;
                for (i=0;i<sites.length;i++){
                        sn=sites[i].getAttribute("hide");
                        if (sn!=null){
                                sites[i].style.display="none";
                        }
                }                       
        }
        function initPage() {
                if (bIsIE4) {
                        document.body.onmouseover=makeHot;
                        document.body.onmouseout=makeNormal;
                        setTimeout('hideAds()', 30000);
                }
        }
        function inAnchor(src) {
                for (i=0;i<100;i++) {
                        if (src.tagName == "A")
                                { return 1; }
                        else if (src.tagName == "BODY")
                                { return 0; }
                        src = src.parentElement;
                }
        return 0; 
        }
        function setColorToAnchor(src, c) {
                for (i=0;i<100;i++) {
                        if (src.style.color != null) {
                                if (c != "RESTORE") {
                                        src.oldcol = src.style.color;
                                        src.style.color = c;
                                } else {
                                        src.style.color = src.oldcol;
                                }
                        }
                        if (src.tagName == "A" || src.tagName == "BODY")
                                { return; }
                        src = src.parentElement;
                }
        }
        
        function makeHot() {
                src = event.toElement;
                if (inAnchor(src) == 1) {
                        setColorToAnchor(src, hotColor);
                }
        }
        function makeNormal() {
                src=event.fromElement;
                if (inAnchor(src) == 1) {
                        setColorToAnchor(src, "RESTORE");
                }
        }
// -->
